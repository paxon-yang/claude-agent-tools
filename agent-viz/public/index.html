<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent 看板</title>
<style>
/* 设计依据：awesome-design-md 的 Apple DESIGN.md —— 羊皮纸底色 #f5f5f7、墨色 #1d1d1f、唯一的交互蓝 #0066cc、
   SF Pro、标题 600 字重 + 负字距、发丝线代替阴影、圆角 8/11/18/胶囊、浅色与深色区块交替；
   液态玻璃只用在"浮在内容上"的层：侧栏、顶部吸附栏、深色分工区块里的卡片、提示框 */
:root {
  --parchment: #f5f5f7; --canvas: #ffffff; --pearl: #fafafc;
  --ink: #1d1d1f; --ink80: #333336; --muted: #6e6e73; --faint: #86868b;
  --hair: rgba(0, 0, 0, .08); --hair2: rgba(0, 0, 0, .05);
  --blue: #0066cc; --blue-focus: #0071e3; --blue-dark: #2997ff;
  --tile: #1d1d1f; --tile2: #272729;
  --haiku: #1FA2B8; --sonnet: #0A7AFF; --opus: #F08C00; --fable: #A64BD6; --none: #8E8E93;
  --haiku-l: #5AC8D8; --sonnet-l: #409CFF; --opus-l: #FFB340; --fable-l: #DA8FFF; --none-l: #AEAEB2;
  --haiku-i: #0E7C8C; --sonnet-i: #0062CC; --opus-i: #B86400; --fable-i: #8A36B8; --none-i: #6E6E73;
  --green: #34C759; --green-i: #1E8E3E; --red: #FF3B30; --red-i: #D70015;
  --display: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --text: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-sm: 8px; --r-md: 11px; --r-lg: 18px; --r-xl: 28px;
  --frost: saturate(180%) blur(20px);
}
* { box-sizing: border-box; }
html { background: var(--parchment); }
body { margin: 0; background: var(--parchment); color: var(--ink); font-family: var(--text); font-size: 14px; line-height: 1.43; letter-spacing: -.224px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue-focus); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }

.f-haiku { --c: var(--haiku); --cl: var(--haiku-l); --ci: var(--haiku-i); }
.f-sonnet { --c: var(--sonnet); --cl: var(--sonnet-l); --ci: var(--sonnet-i); }
.f-opus { --c: var(--opus); --cl: var(--opus-l); --ci: var(--opus-i); }
.f-fable, .f-mythos { --c: var(--fable); --cl: var(--fable-l); --ci: var(--fable-i); }
.f-none { --c: var(--none); --cl: var(--none-l); --ci: var(--none-i); }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; font-size: 12px; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* 液态玻璃材质：透明 + 背景模糊 + 顶边高光 + 发丝边 */
.lg { -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); }

.btn { border: 1px solid var(--blue); background: transparent; color: var(--blue); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 400; cursor: pointer; white-space: nowrap; transition: transform .12s; }
.btn.primary { background: var(--blue); color: #fff; }
.btn:active { transform: scale(.95); }

.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100vh; }

/* ---------- 侧栏：磨砂羊皮纸 ---------- */
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--hair); background: rgba(245, 245, 247, .8); -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); z-index: 5; }
.rail-in { height: 100%; padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 28px; overflow-y: auto; }
.brand { display: flex; align-items: center; justify-content: space-between; }
.brand b { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; }
.conn { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.conn.ok i { background: var(--green); }
.demo { font-size: 12px; color: var(--opus-i); }

.rail h3 { margin: 0 0 10px; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: -.12px; }
.spend .big { font-family: var(--display); font-size: 40px; font-weight: 600; letter-spacing: -.374px; line-height: 1.1; }
.spend .vs { margin-top: 6px; color: var(--ink80); font-size: 14px; }
.spend .vs b { color: var(--green-i); font-weight: 600; }
.mix { display: flex; height: 4px; margin: 18px 0 12px; gap: 2px; border-radius: 999px; overflow: hidden; }
.mix span { background: var(--c); min-width: 3px; }
.mixrow { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; font-size: 12px; padding: 4px 0; color: var(--muted); }
.mixrow .n { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.mixrow .n::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.spend .foot { margin-top: 10px; font-size: 11px; color: var(--faint); letter-spacing: -.08px; }

.projects { display: flex; flex-direction: column; gap: 2px; }
.proj { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-radius: var(--r-md); background: none; cursor: pointer; }
.proj:hover { background: rgba(0, 0, 0, .035); }
.proj.sel { background: var(--canvas); box-shadow: 0 0 0 1px var(--hair2); }
.proj .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .when { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.proj .sub { grid-column: 2; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.proj .sub .chip { font-weight: 400; color: var(--ink80); }
.proj.need .name { color: var(--red-i); }
.st { width: 18px; height: 20px; display: grid; place-items: center; }
.st i { width: 8px; height: 8px; border-radius: 50%; }
.st.running i { background: var(--green); }
.st.idle i { box-shadow: inset 0 0 0 1.5px var(--faint); }
.st.ended i { background: var(--hair); }
.st.need i { width: 16px; height: 16px; background: var(--red); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; }
@media (prefers-reduced-motion: no-preference) { .st.running i { animation: blink 1.6s ease-in-out infinite; } }
@keyframes blink { 50% { opacity: .3; } }

.remote { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink80); }
.url { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--canvas); border: 1px solid var(--hair); padding: 6px 12px; border-radius: 999px; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.remote a { color: var(--blue); text-decoration: none; }
.notify { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }

/* ---------- 主区 ---------- */
main { min-width: 0; padding-bottom: 64px; }
.subnav { position: sticky; top: 0; z-index: 4; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 32px; background: rgba(245, 245, 247, .72); -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); border-bottom: 1px solid var(--hair); }
.subnav .p { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subnav .since { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.running { background: rgba(52, 199, 89, .14); color: var(--green-i); }
.pill.need { background: rgba(255, 59, 48, .12); color: var(--red-i); }
.pill.idle { background: rgba(0, 0, 0, .05); color: var(--ink80); }
.pill.ended { background: rgba(0, 0, 0, .04); color: var(--muted); }
.wrapc { max-width: 1240px; margin: 0 auto; padding: 0 32px; display: flex; flex-direction: column; gap: 24px; }
.alerts { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.alerts:empty { display: none; }
.alert { display: flex; align-items: center; gap: 12px; border-radius: var(--r-lg); padding: 12px 12px 12px 16px; background: var(--canvas); border: 1px solid rgba(255, 59, 48, .28); }
.alert .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.alert .tx { flex: 1; min-width: 0; font-size: 14px; }
.alert .tx b { font-weight: 600; }

.head { padding: 40px 0 8px; }
.head h1 { margin: 0 0 16px; font-family: var(--display); font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -.374px; max-width: 24em; text-wrap: balance; }
.head h1.quiet { color: var(--faint); }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; color: var(--ink80); font-size: 14px; }
.reason { color: var(--ink80); }
.reason em { font-style: normal; color: var(--muted); }

.panel { background: var(--canvas); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 24px; min-width: 0; }
.panel > h2 { margin: 0 0 18px; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; }
.panel > h2 > :first-child { white-space: nowrap; }
.panel > h2 small { font-family: var(--text); font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: -.12px; }

.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; color: var(--ink80); }
.kv b { color: var(--ink); font-weight: 600; }
.meter { display: inline-flex; gap: 3px; align-items: center; }
.meter i { width: 10px; height: 4px; border-radius: 999px; background: var(--hair); }
.meter i.on { background: var(--c); }
.meter span { margin-left: 6px; color: var(--ink80); font-size: 12px; }

/* ---------- 深色分工区块：整页唯一的深色块，液态玻璃卡片浮在模型色的光晕上 ---------- */
.panel.dark { background: var(--tile); border-color: var(--tile); color: #f5f5f7; padding: 28px; border-radius: var(--r-xl); overflow: hidden; position: relative; }
.panel.dark > h2 { color: #f5f5f7; position: relative; z-index: 1; }
.panel.dark > h2 small { color: rgba(235, 235, 245, .6); }
.panel.dark .meter i { background: rgba(255, 255, 255, .16); }
.panel.dark .meter i.on { background: var(--cl); }
.panel.dark .meter span { color: rgba(235, 235, 245, .8); }
.glow { position: absolute; inset: 0; pointer-events: none; opacity: .9; }
.glass { position: relative; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(255, 255, 255, .04), inset 1px 0 0 rgba(255, 255, 255, .06); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(140deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 38%); }

.flowwrap { position: relative; z-index: 1; }
.fsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.fsvg path { fill: none; stroke-width: 1.5; stroke-linecap: round; }
.fsvg .e-done { stroke: rgba(255, 255, 255, .22); }
.fsvg .e-run { stroke: var(--c); stroke-dasharray: 4 6; filter: drop-shadow(0 0 4px var(--c)); }
.fsvg .e-fail { stroke: var(--red); stroke-dasharray: 2 4; }
.fsvg .e-adv { stroke: var(--fable-l); stroke-dasharray: 2 4; opacity: .6; }
.fsvg circle.dot0 { fill: var(--tile); stroke: rgba(255, 255, 255, .5); stroke-width: 1.25; }
.fsvg circle.dot1 { stroke: var(--tile); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) { .fsvg .e-run { animation: flow .9s linear infinite; } }
@keyframes flow { to { stroke-dashoffset: -10; } }

.flowgrid { display: grid; grid-template-columns: minmax(300px, 380px) 110px minmax(0, 500px); align-items: center; position: relative; z-index: 1; }
.flowgrid.solo { grid-template-columns: minmax(300px, 380px) 1fr; }
.leftcol { display: flex; flex-direction: column; gap: 14px; }
.glyph { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 18px;
  background: linear-gradient(180deg, var(--cl), var(--c)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.glyph.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; }

.mn { border-radius: 24px; padding: 20px 20px 16px; }
.mn .hd { display: flex; align-items: center; gap: 12px; }
.mn .ttl { min-width: 0; }
.mn .ttl b { display: block; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; color: #fff; line-height: 1.19; }
.mn .ttl span { font-size: 12px; color: rgba(235, 235, 245, .6); }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.state.running { background: rgba(52, 199, 89, .18); color: #63E28A; }
.state.need { background: rgba(255, 69, 58, .2); color: #FF8A80; }
.state.idle, .state.ended { background: rgba(255, 255, 255, .1); color: rgba(235, 235, 245, .8); }
.state i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: no-preference) { .state.running i { animation: blink 1.4s ease-in-out infinite; } }
.gauges { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin: 18px 0 14px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .06); }
.gauges .g-l { display: flex; flex-direction: column; gap: 9px; font-size: 12px; color: rgba(235, 235, 245, .6); }
.gauges .g-l > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gauges .g-l b { color: #fff; font-weight: 600; }
.ring { position: relative; width: 54px; height: 54px; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .rbg { stroke: rgba(255, 255, 255, .12); }
.ring .rfg { stroke: var(--cl); stroke-linecap: round; }
.ring.warn .rfg { stroke: var(--opus-l); } .ring.bad .rfg { stroke: #FF6961; }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; }
.now { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(235, 235, 245, .7); min-height: 22px; }
.now .mono { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.now .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
.now .pulse.off { background: rgba(255, 255, 255, .2); }
.now .pulse.need { background: var(--red); }
@media (prefers-reduced-motion: no-preference) { .now .pulse:not(.off) { animation: blink 1.1s ease-in-out infinite; } }
.stats { display: flex; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .08); font-size: 12px; color: rgba(235, 235, 245, .6); }
.stats b { color: #fff; font-weight: 600; }
.test { margin-top: 8px; font-size: 12px; font-weight: 600; }
.test.good { color: #63E28A; } .test.bad { color: #FF8A80; }
.adv { border-radius: var(--r-lg); background: rgba(166, 75, 214, .12); border: 1px solid rgba(218, 143, 255, .22); padding: 12px 14px; font-size: 12px; color: rgba(235, 235, 245, .78); margin-left: 28px; }
.adv b { color: var(--fable-l); font-weight: 600; }

.agcol { display: flex; flex-direction: column; gap: 10px; }
.agcol-h { font-size: 12px; color: rgba(235, 235, 245, .6); margin: 0 0 2px 4px; }
.agcol-h b { color: #fff; font-weight: 600; }
.ag { border-radius: var(--r-lg); padding: 12px 14px 12px 12px; }
.ag .r1 { display: flex; align-items: center; gap: 10px; }
.ag .who { min-width: 0; flex: 1; }
.ag .ty { display: block; font-weight: 600; font-size: 14px; color: #fff; line-height: 1.29; }
.ag .mdl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(235, 235, 245, .6); }
.ag .mdl b { color: var(--cl); font-weight: 600; }
.ag .side { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(235, 235, 245, .6); }
.ag .ds { font-size: 13px; color: rgba(255, 255, 255, .92); margin: 9px 0 0 38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .r3 { margin: 4px 0 0 38px; font-size: 12px; color: rgba(235, 235, 245, .55); display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.ag .r3 .mono { color: rgba(235, 235, 245, .85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .r3.ret { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ag.running { border-color: color-mix(in srgb, var(--cl) 55%, transparent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 0 0 1px color-mix(in srgb, var(--cl) 25%, transparent), 0 0 28px -6px color-mix(in srgb, var(--c) 70%, transparent); }
.ag.failed { border-color: rgba(255, 69, 58, .5); }
.si { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 10px; font-weight: 600; color: #fff; }
.si.done { background: var(--green); }
.si.failed { background: var(--red); }
.si.stopped { background: var(--none); }
.si.running { border: 2px solid rgba(255, 255, 255, .15); border-top-color: var(--cl); }
@media (prefers-reduced-motion: no-preference) { .si.running { animation: spin .8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.more { font-size: 12px; color: rgba(235, 235, 245, .55); padding: 2px 4px; }
.solo-note { margin-left: 32px; padding: 16px 18px; border-radius: var(--r-lg); color: rgba(235, 235, 245, .6); font-size: 13px; max-width: 420px; }

/* ---------- 时间轴 ---------- */
.tl { position: relative; }
.tl-axis { position: relative; height: 22px; margin-left: 112px; }
.tl-axis span { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: var(--faint); white-space: nowrap; }
.tl-row { display: grid; grid-template-columns: 112px 1fr; align-items: center; min-height: 36px; }
.tl-row + .tl-row { border-top: 1px solid var(--hair2); }
.tl-label { font-size: 12px; color: var(--ink80); padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-label b { color: var(--ink); font-weight: 600; }
.tl-track { position: relative; height: 36px; }
.tl-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--hair2); }
.seg { position: absolute; top: 10px; height: 16px; border-radius: 999px; min-width: 6px; background: var(--c); color: #fff; font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 8px; overflow: hidden; white-space: nowrap; cursor: default; }
.seg.main { top: 8px; height: 20px; line-height: 20px; }
.seg.open { background: repeating-linear-gradient(135deg, var(--c) 0 7px, color-mix(in srgb, var(--c) 70%, #fff) 7px 14px); }
.seg.hb { opacity: .5; }
.seg:hover { z-index: 2; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--c); }
.tl-now { position: absolute; top: 4px; bottom: 4px; border-left: 1.5px solid var(--red); }
.tl-legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--muted); }
.tl-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tl-legend span::before { content: ""; width: 14px; height: 6px; border-radius: 999px; background: var(--c); }
.tl-empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: rgba(29, 29, 31, .72); -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); color: #fff; border: 1px solid rgba(255, 255, 255, .12); border-radius: var(--r-md); padding: 9px 12px; font-size: 12px; line-height: 1.5; opacity: 0; transition: opacity .12s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15); }
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip .d { color: rgba(235, 235, 245, .6); }

.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; }
table.use { width: 100%; border-collapse: collapse; font-size: 14px; }
table.use th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12px; padding: 0 0 8px; }
table.use td { padding: 9px 0; border-top: 1px solid var(--hair); }
table.use td.r, table.use th.r { text-align: right; }
table.use .chip { font-size: 14px; }
.save { margin-top: 16px; padding: 12px 16px; border-radius: var(--r-md); background: var(--parchment); color: var(--ink); font-size: 14px; }
.save b { font-weight: 600; color: var(--green-i); }
.fine { margin-top: 10px; font-size: 12px; color: var(--muted); }

.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 48px 1fr auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--hair); align-items: baseline; }
.hist li:first-child { border-top: 0; padding-top: 0; }
.hist .t { color: var(--muted); font-size: 12px; }
.hist .p { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .p.hb { color: var(--muted); }
.hist .d { color: var(--muted); font-size: 12px; text-align: right; }
.hist .m { grid-column: 2 / 4; display: flex; gap: 12px; flex-wrap: wrap; }
.hist .m .chip { font-weight: 400; color: var(--ink80); }
.hist .cur .p { font-weight: 600; }

details.log { background: var(--canvas); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 16px 24px; }
details.log summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.374px; }
details.log summary small { font-family: var(--text); font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; letter-spacing: -.12px; }
.lrow { display: grid; grid-template-columns: 60px 96px 1fr; gap: 10px; padding: 7px 0; font-size: 12px; border-top: 1px solid var(--hair2); }
.lrow:first-of-type { margin-top: 12px; }
.lrow .t { color: var(--muted); }
.lrow .w { color: var(--ci); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow.k-bad .x { color: var(--red-i); } .lrow.k-good .x { color: var(--green-i); } .lrow.k-task .x { font-weight: 600; }

.empty { padding: 120px 20px; text-align: center; color: var(--ink80); }
.empty h2 { font-family: var(--display); font-size: 34px; font-weight: 600; letter-spacing: -.374px; color: var(--ink); margin: 0 0 10px; }
.empty code { font-family: var(--mono); background: var(--canvas); border: 1px solid var(--hair); padding: 2px 8px; border-radius: 999px; }

@media (max-width: 1180px) { .split { grid-template-columns: 1fr; } }
@media (max-width: 1000px) {
  .flowgrid, .flowgrid.solo { grid-template-columns: 1fr; align-items: stretch; }
  .flowgrid .gap { height: 18px; }
  .agcol, .solo-note, .adv { margin-left: 30px; }
  .solo-note { margin-top: 14px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--hair); }
  .rail-in { padding: 16px; gap: 16px; }
  .projects { flex-direction: row; overflow-x: auto; gap: 6px; }
  .projects h3 { display: none; }
  .proj { width: auto; min-width: 170px; background: var(--canvas); box-shadow: 0 0 0 1px var(--hair2); }
  .spend .big { font-size: 28px; }
  .spend .rows, .spend .foot { display: none; }
  .remote { margin-top: 0; padding-top: 12px; } #remote { display: none; }
  .subnav { padding: 0 16px; }
  .subnav .p { font-size: 17px; }
  .wrapc { padding: 0 12px; gap: 16px; }
  .head { padding-top: 24px; }
  .head h1 { font-size: 28px; }
  .panel { padding: 18px; }
  .panel.dark { padding: 18px; border-radius: 22px; }
  .tl-axis { margin-left: 76px; }
  .tl-row { grid-template-columns: 76px 1fr; }
  .lrow { grid-template-columns: 56px 1fr; }
  .lrow .x { grid-column: 1 / 3; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .rail, .subnav { background: rgba(245, 245, 247, .97); }
  .glass { background: #2c2c2e; }
  .tip { background: rgba(29, 29, 31, .95); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="rail-in">
    <div class="brand"><b>Agent 看板</b><span class="conn" id="conn"><i></i><span>连接中</span></span></div>
    <div id="demo"></div>
    <section class="spend" id="spend"></section>
    <nav class="projects" id="projects" aria-label="项目"></nav>
    <section class="remote"><div id="notify"></div><div id="remote" style="margin-top:16px"></div></section>
  </div></aside>
  <main id="main"></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NAMES = { haiku: 'Haiku', sonnet: 'Sonnet', opus: 'Opus', fable: 'Fable', mythos: 'Mythos' };
const ORDER = ['haiku', 'sonnet', 'opus', 'fable'];
const STATUS = { running: '运行中', idle: '等你下一步', 'needs-you': '等你确认', ended: '已结束', done: '已完成', failed: '出错', stopped: '已中断' };
const EFF = { low: 1, medium: 2, high: 3, xhigh: 4, max: 4 };
let state = null, selected = null, pinned = false, skew = 0;
const seenNeeds = new Set();
try { selected = localStorage.getItem('viz.sel'); pinned = !!selected; } catch (e) { }

const f = fam => 'f-' + (fam || 'none');
const nowS = () => Date.now() / 1000 + skew;
const kfmt = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k' : String(Math.round(n || 0));
const money = v => v == null ? '—' : v < 0.01 ? '<$0.01' : '$' + (v < 10 ? v.toFixed(2) : v.toFixed(1));
const hm = ts => { const d = new Date(ts * 1000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function dur(sec) { sec = Math.max(0, Math.round(sec)); if (sec < 60) return sec + ' 秒'; if (sec < 3600) return Math.floor(sec / 60) + ' 分' + (sec % 60 ? ' ' + (sec % 60) + ' 秒' : ''); return Math.floor(sec / 3600) + ' 小时 ' + Math.floor(sec % 3600 / 60) + ' 分'; }
function ago(ts) { const s = nowS() - ts; if (s < 60) return '刚刚'; if (s < 3600) return Math.floor(s / 60) + ' 分钟前'; if (s < 86400) return Math.floor(s / 3600) + ' 小时前'; return Math.floor(s / 86400) + ' 天前'; }
const timer = (start, end) => end ? dur(end - start) : `<span data-since="${start}">${dur(nowS() - start)}</span>`;
const chip = (fam, label) => `<span class="chip ${f(fam)}">${esc(label || NAMES[fam] || '未知')}</span>`;
function meter(level, fam) {
  if (!level) return '<span style="color:var(--muted)">—</span>';
  const n = EFF[level] || 0; let s = '';
  for (let i = 0; i < 4; i++) s += `<i class="${i < n ? 'on' : ''}"></i>`;
  return `<span class="meter ${f(fam)}" aria-label="effort ${esc(level)}">${s}<span>${esc(level)}</span></span>`;
}
const stKey = x => !x.active ? 'ended' : x.status === 'needs-you' ? 'need' : x.status === 'running' ? 'running' : 'idle';

const cache = {};
function put(id, html) { if (cache[id] === html) return; cache[id] = html; const el = document.getElementById(id); if (el) el.innerHTML = html; }

function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('#conn').className = 'conn ok'; $('#conn span').textContent = '实时'; };
  es.onmessage = ev => { state = JSON.parse(ev.data); skew = state.now - Date.now() / 1000; render(); };
  es.onerror = () => { $('#conn').className = 'conn'; $('#conn span').textContent = '重连中'; };
}

function pick() {
  const ss = state.sessions;
  if (!ss.length) return null;
  const sel = ss.find(s => s.id === selected);
  if (pinned && sel) return sel;
  const auto = ss.find(s => s.active && s.status === 'needs-you') || ss.find(s => s.active && s.status === 'running') || ss.find(s => s.active) || ss[0];
  selected = auto.id; return auto;
}
function select(id) { selected = id; pinned = true; try { localStorage.setItem('viz.sel', id); } catch (e) { } render(); }

function render() {
  if (!state) return;
  const s = pick();
  put('demo', state.demo ? '<span class="demo">演示模式：以下是模拟数据</span>' : '');
  renderSpend(); renderProjects(s); renderRemote(); notifyNeeds();
  if (!s) {
    put('main', `<div class="empty"><h2>现在没有 Claude Code 在运行</h2><p>在任意项目文件夹里打开终端，输入 <code>claude</code>，这里会自动出现。</p></div>`);
    return;
  }
  if (!document.getElementById('flow')) {
    for (const k of Object.keys(cache)) if (!['demo', 'spend', 'projects', 'remote', 'notify'].includes(k)) delete cache[k];
    $('#main').innerHTML = `<div class="subnav" id="subnav"></div><div class="wrapc"><div class="alerts" id="alerts"></div><header class="head" id="head"></header>
      <section class="panel dark"><div class="glow" id="glow"></div><h2>分工 <small id="flowsub"></small></h2><div id="flow"></div></section>
      <section class="panel"><h2>模型时间轴 <small>每一轮主会话和每个子代理各用了什么模型、跑了多久</small></h2><div id="tl"></div></section>
      <div class="split"><section class="panel"><h2>这个会话的花费 <small>按 API 公开价估算</small></h2><div id="use"></div></section>
      <section class="panel"><h2>任务记录 <small id="histsub"></small></h2><div id="hist"></div></section></div>
      <details class="log" id="logbox"><summary>事件明细<small>最近 40 条</small></summary><div id="log"></div></details></div>`;
  }
  renderAlerts(); renderHead(s); renderFlow(s); renderTimeline(s); renderUse(s); renderHist(s); renderLog(s);
  document.title = (state.needsYou.length ? `(${state.needsYou.length}) 等你确认 · ` : '') + 'Agent 看板';
}

function renderSpend() {
  const t = state.totals;
  const fams = ORDER.filter(k => t.byModel[k]);
  const total = fams.reduce((n, k) => n + (t.byModel[k].cost || 0), 0) || 1;
  const bars = fams.map(k => `<span class="${f(k)}" style="flex:${Math.max(.02, (t.byModel[k].cost || 0) / total)}" title="${NAMES[k]} ${money(t.byModel[k].cost)}"></span>`).join('');
  const rows = fams.map(k => `<div class="mixrow ${f(k)}"><span class="n">${NAMES[k]}</span><span class="num">${kfmt(t.byModel[k].tokens)} token</span><span class="num">${money(t.byModel[k].cost)}</span></div>`).join('');
  put('spend', `<h3>近 ${t.hours} 小时 · ${t.sessions} 个会话 · 完成 ${t.tasks} 个任务</h3>
    <div class="big num">${money(t.cost)}</div>
    ${t.saved != null && t.baseline > 0 ? `<div class="vs">全用 ${NAMES[t.baselineModel] || t.baselineModel} 约 ${money(t.baseline)}，<b>少花 ${Math.round(t.saved * 100)}%</b></div>` : '<div class="vs">还没有用量数据</div>'}
    ${fams.length ? `<div class="mix">${bars}</div><div class="rows">${rows}</div>` : ''}
    <div class="foot">按 API 公开价估算${t.unpriced ? '，有模型未定价' : ''}；用订阅时只作参考。</div>`);
}

function renderProjects(sel) {
  const dup = {}; state.sessions.forEach(x => dup[x.project] = (dup[x.project] || 0) + 1);
  const html = `<h3>项目</h3>` + state.sessions.map(x => {
    const k = stKey(x);
    const when = dup[x.project] > 1 ? `<span class="when">${hm(x.startedAt)} 开始</span>` : '';
    return `<button class="proj ${f(x.family)} ${x.id === (sel && sel.id) ? 'sel' : ''} ${k === 'need' ? 'need' : ''}" onclick="select('${esc(x.id)}')" title="${esc(x.cwd)}">
      <span class="st ${k}"><i>${k === 'need' ? '!' : ''}</i></span><span class="name">${esc(x.project)}${when}</span>
      <span class="sub">${chip(x.family, x.model)}<span>${k === 'need' ? '等你确认' : k === 'running' ? '运行中' : esc(ago(x.lastTs))}</span></span></button>`;
  }).join('');
  put('projects', state.sessions.length ? html : '<h3>项目</h3><div style="color:var(--muted);font-size:13px">还没有会话</div>');
}

function renderRemote() {
  const r = state.remote || {};
  let html = '<h3>在其他设备上看</h3>';
  if (r.public) html += `任何设备的浏览器都能打开，用你的邮箱收验证码登录：<div class="url"><code>${esc(r.urls[0])}</code><button class="btn" onclick="copyUrl('${esc(r.urls[0])}', this)">复制</button></div>`;
  else if (r.mode === 'off') html += '远程访问已关闭（config.json 里 remote 设为 off）。';
  else if (r.urls && r.urls.length) {
    html += `你的其他电脑和手机登录同一个 Tailscale 账号后，打开：` + r.urls.slice(0, 2).map((u, i) =>
      `<div class="url"><code>${esc(u)}</code>${i === 0 ? `<button class="btn" onclick="copyUrl('${esc(u)}', this)">复制</button>` : ''}</div>`).join('');
  } else html += `装好 Tailscale 并登录后，你的其他电脑和手机就能打开这个看板，只有你自己的设备能访问。<div class="url"><a href="https://tailscale.com/download" target="_blank" rel="noopener">下载 Tailscale</a></div>`;
  put('remote', html);
}
function copyUrl(u, btn) {
  const done = () => { btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(u).then(done);
  else { const t = document.createElement('textarea'); t.value = u; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
}

// ---------- 等你确认：横幅 + 提醒 ----------
let soundOn = false;
try { soundOn = localStorage.getItem('viz.sound') === '1'; } catch (e) { }
function renderAlerts() {
  const n = state.needsYou;
  const canNotify = 'Notification' in window && window.isSecureContext;
  const ctrl = canNotify
    ? (Notification.permission === 'default' ? `<button class="btn" onclick="Notification.requestPermission().then(render)">开启桌面提醒</button>` : Notification.permission === 'granted' ? '桌面提醒已开启' : '浏览器拦截了桌面提醒，可在地址栏左边的网站设置里允许')
    : `<button class="btn" onclick="toggleSound()">${soundOn ? '关闭提示音' : '开启提示音'}</button>`;
  put('alerts', n.map(x => `<div class="alert" role="alert"><span class="ic">!</span><div class="tx"><b>${esc(x.project)}</b> 在等你确认${x.msg ? '：' + esc(x.msg) : ''}</div><button class="btn primary" onclick="select('${esc(x.id)}')">查看</button></div>`).join(''));
  put('notify', `<h3>等你确认时提醒我</h3><div class="notify">${ctrl}</div>`);
}
function toggleSound() { soundOn = !soundOn; try { localStorage.setItem('viz.sound', soundOn ? '1' : '0'); } catch (e) { } if (soundOn) beep(); delete cache.alerts; render(); }
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(); const g = ac.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.2, ac.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .35);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .4);
  } catch (e) { }
}
function notifyNeeds() {
  const ids = new Set(state.needsYou.map(x => x.id + '|' + (x.msg || '')));
  for (const x of state.needsYou) {
    const key = x.id + '|' + (x.msg || '');
    if (seenNeeds.has(key)) continue;
    seenNeeds.add(key);
    if (!state.demo || seenNeeds.size > 1) {
      if ('Notification' in window && window.isSecureContext && Notification.permission === 'granted') new Notification(`${x.project} 在等你确认`, { body: x.msg || '' });
      else if (soundOn) beep();
    }
  }
  for (const k of [...seenNeeds]) if (!ids.has(k)) seenNeeds.delete(k);
}

// ---------- 当前任务 ----------
function renderHead(s) {
  const k = stKey(s);
  const lastTurn = (s.turns || []).filter(x => !x.handback).slice(-1)[0];
  const t = s.task || (lastTurn && { prompt: lastTurn.prompt, startedAt: lastTurn.start, endedAt: lastTurn.end });
  const r = s.route && s.route.last;
  const pillCls = k === 'need' ? 'need' : k;
  put('subnav', `<span class="p">${esc(s.project)}</span><span class="pill ${pillCls}">${k === 'need' ? '等你确认' : STATUS[k] || STATUS[s.status]}</span><span class="since">会话开始于 ${hm(s.startedAt)}</span>`);
  put('head', `<h1 class="${t ? '' : 'quiet'}">${t ? esc(t.prompt) : '还没有收到任务'}</h1>
    <div class="meta">${chip(s.family, s.model || '模型未知')}${meter(s.effort, s.family)}
      ${t ? `<span>这一轮${t.endedAt || !s.active ? '用了' : '已用'} ${timer(t.startedAt, t.endedAt || (s.active ? null : s.lastTs))}</span>` : ''}
      ${r ? `<span class="reason"><em>为什么选它：</em>${esc(r.reason)}${s.route.mode && s.route.mode !== 'auto' ? `（模式：${esc(s.route.mode)}）` : ''}${s.route.pendingDown ? `；下一轮还简单就换 ${esc(NAMES[s.route.pendingDown] || s.route.pendingDown)}` : ''}</span>` : ''}</div>`);
}

const SI = { done: '✓', failed: '✕', stopped: '■', running: '' };
function ring(pct, fam) {
  const r = 24, c = 2 * Math.PI * r, v = Math.min(1, Math.max(0, pct));
  const cls = pct > .85 ? 'bad' : pct > .6 ? 'warn' : '';
  return `<div class="ring ${f(fam)} ${cls}" title="上下文占用 ${(pct * 100).toFixed(1)}%"><svg width="58" height="58" viewBox="0 0 58 58"><circle class="rbg" cx="29" cy="29" r="${r}" fill="none" stroke-width="5"/><circle class="rfg" cx="29" cy="29" r="${r}" fill="none" stroke-width="5" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}"/></svg><span>${pct < .1 ? (pct * 100).toFixed(1) : Math.round(pct * 100)}%</span></div>`;
}
function renderFlow(s) {
  const k = stKey(s);
  const pct = s.contextLimit ? s.context / s.contextLimit : 0;
  const a = s.advisor || {};
  const kids = s.agents || [];
  const live = kids.filter(x => x.status === 'running').length;
  const stLabel = { running: '运行中', need: '等你确认', idle: '等你下一步', ended: '已结束' }[k];
  const nowLine = s.currentTool ? `<span class="pulse"></span><span>正在</span><span class="mono">${esc(s.currentTool)}</span>`
    : k === 'running' ? (live ? `<span class="pulse"></span><span>等 ${live} 个子代理交回结果</span>` : '<span class="pulse"></span><span>思考中…</span>')
    : k === 'need' ? '<span class="pulse need"></span><span style="color:#FF8A80;font-weight:600">等你在终端里确认</span>'
    : s.lastTool ? `<span class="pulse off"></span><span>上一步</span><span class="mono">${esc(s.lastTool)}</span>` : '<span class="pulse off"></span><span>空闲</span>';
  const name = s.model || '主会话';
  const main = `<div class="mn glass ${f(s.family)}" id="fmain">
      <div class="hd"><span class="glyph ${f(s.family)}">${esc((NAMES[s.family] || name)[0])}</span><div class="ttl"><b>${esc(name)}</b><span>主会话 · 计划、派活、汇总、检查</span></div><span class="state ${k}"><i></i>${stLabel}</span></div>
      <div class="gauges"><div class="g-l"><div><span>effort</span>${meter(s.effort, s.family)}</div><div><span>上下文</span><b class="num">${kfmt(s.context)} / ${kfmt(s.contextLimit)}</b></div></div>${ring(pct, s.family)}</div>
      <div class="now">${nowLine}</div>
      ${s.test ? `<div class="test ${s.test.failed ? 'bad' : 'good'}">${s.test.failed ? '测试有失败' : '测试通过'}：${s.test.passed}/${s.test.total}</div>` : ''}
      <div class="stats"><span>工具 <b class="num">${s.toolCount}</b> 次</span><span>子代理 <b class="num">${s.totalAgents}</b> 个</span><span>完成 <b class="num">${s.tasksDone}</b> 轮</span></div>
    </div>`;
  const adv = a.calls ? `<div class="adv" id="fadv"><b>Fable 顾问 · 已介入 ${a.calls} 次</b>${a.last ? '<br>' + esc(a.last.slice(0, 150)) + (a.last.length > 150 ? '…' : '') : ''}</div>` : '';
  const shown = kids.slice(-6), hidden = kids.length - shown.length;
  const cards = shown.map(x => `<div class="ag glass ${f(x.family)} ${esc(x.status)}" data-aid="${esc(x.id)}" data-st="${esc(x.status)}">
      <div class="r1"><span class="glyph sm ${f(x.family)}">${esc((NAMES[x.family] || x.model || '?')[0])}</span>
        <div class="who"><span class="ty">${esc(x.type)}</span><span class="mdl"><b>${esc(x.model || '模型未知')}</b>${meter(x.effort, x.family)}</span></div>
        <span class="side"><span class="num">${timer(x.startedAt, x.endedAt)}</span><span class="si ${esc(x.status)}" title="${esc(STATUS[x.status] || x.status)}">${SI[x.status] || ''}</span></span></div>
      <div class="ds" title="${esc(x.description || '')}">${esc(x.description || '（没有取到任务描述）')}</div>
      ${x.status === 'running' ? `<div class="r3"><span>${x.currentTool ? '正在' : '思考中…'}</span>${x.currentTool ? `<span class="mono">${esc(x.currentTool)}</span>` : ''}</div>`
        : x.lastMessage ? `<div class="r3 ret" title="${esc(x.lastMessage)}">交回：${esc(x.lastMessage)}</div>` : `<div class="r3">用了 ${x.toolCount} 次工具</div>`}
    </div>`).join('');
  const right = kids.length
    ? `<span class="gap"></span><div class="agcol"><div class="agcol-h">派出 <b>${kids.length}</b> 个子代理${live ? `，<b>${live}</b> 个在跑` : '，都已交回'}</div>${cards}${hidden ? `<div class="more">还有 ${hidden} 个更早派出的</div>` : ''}</div>`
    : `<div class="solo-note glass">这一轮没有派子代理，主会话自己在做。</div>`;
  const fams = [...new Set(kids.map(x => x.family).filter(Boolean))];
  const gl = [`radial-gradient(420px 320px at 18% 50%, color-mix(in srgb, var(--${s.family === 'mythos' ? 'fable' : s.family || 'none'}) 30%, transparent), transparent 70%)`]
    .concat(fams.slice(0, 3).map((fm, i) => `radial-gradient(360px 260px at 78% ${20 + i * 30}%, color-mix(in srgb, var(--${fm === 'mythos' ? 'fable' : fm}) 24%, transparent), transparent 70%)`));
  put('glow', `<div style="position:absolute;inset:0;background:${gl.join(',')}"></div>`);
  put('flowsub', s.earlierAgents ? `这个会话更早还派过 ${s.earlierAgents} 个子代理` : '');
  put('flow', `<div class="flowwrap" id="fwrap"><svg class="fsvg" id="fsvg" aria-hidden="true"></svg><div class="flowgrid ${kids.length ? '' : 'solo'}"><div class="leftcol">${main}${adv}</div>${right}</div></div>`);
  requestAnimationFrame(drawEdges);
}

// 按卡片的实际位置画连线：并排时从主会话右侧画曲线到每个子代理左侧；窄屏上下排列时从左边竖线分出去
function drawEdges() {
  const wrap = document.getElementById('fwrap'), svg = document.getElementById('fsvg'), mainEl = document.getElementById('fmain');
  if (!wrap || !svg || !mainEl) return;
  const W = wrap.getBoundingClientRect();
  const M = mainEl.getBoundingClientRect();
  const famVar = el => { const m = (el.className.match(/f-(\w+)/) || [])[1] || 'none'; return `var(--${m === 'mythos' ? 'fable' : m}-l)`; };
  let out = '';
  const cards = [...wrap.querySelectorAll('.ag')];
  const stacked = cards.length && cards[0].getBoundingClientRect().top > M.bottom - 2;
  cards.forEach(el => {
    const R = el.getBoundingClientRect();
    const st = el.dataset.st;
    const cls = st === 'running' ? 'e-run' : st === 'failed' ? 'e-fail' : 'e-done';
    const color = famVar(el);
    let d, x0, y0, x1, y1;
    if (!stacked) {
      x0 = M.right - W.left; y0 = M.top + M.height / 2 - W.top;
      x1 = R.left - W.left; y1 = R.top + R.height / 2 - W.top;
      const dx = (x1 - x0) * 0.55;
      d = `M${x0},${y0} C${x0 + dx},${y0} ${x1 - dx},${y1} ${x1},${y1}`;
    } else {
      x0 = M.left - W.left + 14; y0 = M.bottom - W.top;
      x1 = R.left - W.left; y1 = R.top + R.height / 2 - W.top;
      d = `M${x0},${y0} L${x0},${y1 - 10} Q${x0},${y1} ${x0 + 10},${y1} L${x1},${y1}`;
    }
    out += `<path class="${cls}" style="--c:${color}" d="${d}"/><circle class="dot1" cx="${x1}" cy="${y1}" r="4.5" fill="${st === 'running' ? color : st === 'failed' ? 'var(--red)' : 'rgba(255,255,255,.55)'}"/>`;
  });
  if (cards.length) {
    const x0 = stacked ? M.left - W.left + 14 : M.right - W.left, y0 = stacked ? M.bottom - W.top : M.top + M.height / 2 - W.top;
    out += `<circle class="dot0" cx="${x0}" cy="${y0}" r="5"/>`;
  }
  const adv = document.getElementById('fadv');
  if (adv) {
    const A = adv.getBoundingClientRect();
    const x = A.left - W.left - (stacked ? 0 : 14), y0 = M.bottom - W.top - 18, y1 = A.top + A.height / 2 - W.top;
    if (!stacked) out += `<path class="e-adv" d="M${M.left - W.left + 14},${M.bottom - W.top} L${M.left - W.left + 14},${y1 - 8} Q${M.left - W.left + 14},${y1} ${M.left - W.left + 22},${y1} L${A.left - W.left},${y1}"/>`;
    void x; void y0;
  }
  svg.innerHTML = out;
}
window.addEventListener('resize', () => requestAnimationFrame(drawEdges));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawEdges));

// ---------- 模型时间轴 ----------
function renderTimeline(s) {
  const turns = (s.turns || []).slice(-12);
  const lanes = (s.lanes || []).filter(l => !turns.length || l.start >= turns[0].start - 5).slice(-8);
  if (!turns.length && !lanes.length) { put('tl', '<div class="tl-empty">发出第一个任务后，这里会画出每一轮用的模型。</div>'); return; }
  const t1 = s.active ? nowS() : Math.max(s.lastTs, ...turns.map(t => t.end || 0), ...lanes.map(l => l.end || 0));
  const first = Math.min(...turns.map(t => t.start), ...lanes.map(l => l.start));
  const raw = Math.max(60, t1 - first);
  const t0 = first - raw * 0.02;                 // 左边留一点空
  const span = Math.max(60, t1 - t0);
  const x = ts => Math.max(0, Math.min(100, (ts - t0) / span * 100));
  const steps = [10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400];
  const maxTicks = window.innerWidth < 600 ? 3 : 6;
  const step = steps.find(v => span / v <= maxTicks) || 28800;
  const ticks = []; for (let v = Math.ceil(t0 / step) * step; v <= t1; v += step) ticks.push(v);
  const grid = ticks.map(v => `<span class="tl-grid" style="left:${x(v)}%"></span>`).join('');
  const now = s.active ? `<span class="tl-now" style="left:${x(t1)}%" title="现在"></span>` : '';
  const segs = turns.map((t, ti) => t.segs.map((g, i) => {
    const a = Math.max(g.start, t.start), b = i < t.segs.length - 1 ? t.segs[i + 1].start : (t.end || t1);
    const w = x(b) - x(a);
    const tip = `<b>${esc(NAMES[g.family] || g.model || '未知')}</b>${g.effort ? ' · ' + esc(g.effort) : ''}<br>${esc(t.prompt)}<br><span class='d'>${hm(a)} 开始 · ${t.end ? dur(b - a) : '进行中'}${g.reason ? '<br>' + esc(g.by ? g.by + '：' : '') + esc(g.reason) : ''}</span>`;
    return `<span class="seg main ${f(g.family)} ${t.end ? '' : 'open'} ${t.handback ? 'hb' : ''}" style="left:${x(a)}%;width:${w}%" data-tip="${esc(tip)}">${w > 7 ? esc(NAMES[g.family] || '') : ''}</span>`;
  }).join('')).join('');
  const rows = lanes.map(l => {
    const b = l.end || t1, w = x(b) - x(l.start);
    const tip = `<b>${esc(l.type)}</b> · ${esc(l.model || '')}<br>${esc(l.description || '')}<br><span class='d'>${hm(l.start)} 开始 · ${l.end ? dur(b - l.start) : '进行中'}</span>`;
    return `<div class="tl-row"><div class="tl-label" title="${esc(l.type)}">${esc(l.type)}</div><div class="tl-track">${grid}<span class="seg ${f(l.family)} ${l.end ? '' : 'open'}" style="left:${x(l.start)}%;width:${w}%" data-tip="${esc(tip)}">${w > 9 ? esc(l.model || '') : ''}</span></div></div>`;
  }).join('');
  const used = [...new Set([...turns.flatMap(t => t.segs.map(g => g.family)), ...lanes.map(l => l.family)].filter(Boolean))];
  put('tl', `<div class="tl"><div class="tl-axis">${ticks.map(v => `<span style="left:${x(v)}%">${step < 60 ? hm(v) + ':' + String(Math.round(v) % 60).padStart(2, '0') : hm(v)}</span>`).join('')}</div>
    <div class="tl-row"><div class="tl-label"><b>主会话</b></div><div class="tl-track">${grid}${segs}${now}</div></div>${rows}</div>
    <div class="tl-legend">${ORDER.filter(k => used.includes(k)).map(k => `<span class="${f(k)}">${NAMES[k]}</span>`).join('')}<span style="--c:repeating-linear-gradient(135deg,#98A2B3 0 4px,#D0D5DD 4px 8px)">斜纹 = 还在进行</span></div>`);
}
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.classList.remove('on'); return; }
  tip.innerHTML = el.dataset.tip; tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 16 + h > window.innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
});

// ---------- 花费 ----------
function renderUse(s) {
  const u = s.usage || { byModel: {} };
  const fams = ORDER.filter(k => u.byModel[k]);
  if (!fams.length) { put('use', '<div class="tl-empty">还没有读到这个会话的用量。</div>'); return; }
  const rows = fams.map(k => { const b = u.byModel[k]; return `<tr><td>${chip(k)}</td><td class="r num">${kfmt(b.in + b.cw)}</td><td class="r num">${kfmt(b.cr)}</td><td class="r num">${kfmt(b.out)}</td><td class="r num"><b>${money(b.cost)}</b></td></tr>`; }).join('');
  put('use', `<table class="use"><thead><tr><th>模型</th><th class="r">新输入</th><th class="r">缓存读取</th><th class="r">输出</th><th class="r">估算</th></tr></thead><tbody>${rows}
    <tr><td><b>合计</b></td><td></td><td></td><td></td><td class="r num"><b>${money(u.cost)}</b></td></tr></tbody></table>
    ${u.saved != null && u.baseline > 0 ? (u.saved >= 0.01 ? `<div class="save">同样的活全用 ${NAMES[state.totals.baselineModel] || 'Opus'}，大约要 ${money(u.baseline)}；自动选模型让这个会话<b>少花 ${Math.round(u.saved * 100)}%</b>。</div>`
      : `<div class="fine">这个会话目前都在用 ${NAMES[state.totals.baselineModel] || 'Opus'}，跟全用它花的一样。</div>`) : ''}
    <div class="fine">单位是 token。缓存读取最便宜，所以长对话里换模型会多花一次"重新读取"的钱。</div>`);
}

function renderHist(s) {
  const turns = (s.turns || []).slice().reverse();
  put('histsub', turns.length ? `共 ${turns.filter(t => !t.handback).length} 轮，最新在上` : '');
  if (!turns.length) { put('hist', '<div class="tl-empty">还没有任务。</div>'); return; }
  put('hist', `<ul class="hist">${turns.slice(0, 12).map(t => {
    const fams = [...new Set(t.segs.map(g => g.family).filter(Boolean))];
    return `<li class="${t.end ? '' : 'cur'}"><span class="t num">${hm(t.start)}</span><span class="p ${t.handback ? 'hb' : ''}" title="${esc(t.prompt)}">${esc(t.prompt)}</span><span class="d num">${t.end ? dur(t.end - t.start) : '进行中'}</span>
      <span class="m">${fams.map(k => chip(k)).join('')}</span></li>`;
  }).join('')}</ul>`);
}

function renderLog(s) {
  const famOf = w => w === 'main' ? s.family : w === 'advisor' ? 'fable' : w === 'router' ? 'haiku' : w === 'you' ? 'none' : ((s.lanes || []).find(l => l.type === w) || {}).family;
  const label = w => ({ main: '主会话', advisor: '顾问', you: '你', router: '自动选模型' })[w] || w;
  put('log', s.timeline.slice().reverse().map(r => `<div class="lrow k-${esc(r.kind)}"><span class="t num">${hm(r.ts)}</span><span class="w ${f(famOf(r.who))}">${esc(label(r.who))}</span><span class="x">${esc(r.text)}</span></div>`).join(''));
}

setInterval(() => { const t = nowS(); document.querySelectorAll('[data-since]').forEach(el => { el.textContent = dur(t - Number(el.dataset.since)); }); }, 1000);
setInterval(() => { if (state) { delete cache.tl; renderTimeline(pick() || {}); } }, 5000);
connect();
</script>
</body>
