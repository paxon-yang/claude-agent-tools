<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Board</title>
<style>
/* 设计依据：awesome-design-md 的 Apple DESIGN.md —— 羊皮纸底色 #f5f5f7、墨色 #1d1d1f、唯一的交互蓝 #0066cc、
   SF Pro、标题 600 字重 + 负字距、发丝线代替阴影、圆角 8/11/18/胶囊、浅色与深色区块交替；
   液态玻璃只用在"浮在内容上"的层：侧栏、顶部吸附栏、深色分工区块里的卡片、提示框 */
:root {
  --parchment: #f5f5f7; --canvas: #ffffff; --pearl: #fafafc;
  --ink: #1d1d1f; --ink80: #333336; --muted: #6e6e73; --faint: #86868b;
  --hair: rgba(0, 0, 0, .08); --hair2: rgba(0, 0, 0, .05);
  --blue: #0066cc; --blue-focus: #0071e3; --blue-dark: #2997ff;
  --tile: #1d1d1f; --tile2: #272729;
  --haiku: #1FA2B8; --sonnet: #0A7AFF; --opus: #F08C00; --fable: #A64BD6; --none: #8E8E93;
  --haiku-l: #5AC8D8; --sonnet-l: #409CFF; --opus-l: #FFB340; --fable-l: #DA8FFF; --none-l: #AEAEB2;
  --haiku-i: #0E7C8C; --sonnet-i: #0062CC; --opus-i: #B86400; --fable-i: #8A36B8; --none-i: #6E6E73;
  --green: #34C759; --green-i: #1E8E3E; --red: #FF3B30; --red-i: #D70015;
  --display: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --text: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-sm: 8px; --r-md: 11px; --r-lg: 18px; --r-xl: 28px;
  --frost: saturate(180%) blur(20px);
}
* { box-sizing: border-box; }
html { background: var(--parchment); }
body { margin: 0; background: var(--parchment); color: var(--ink); font-family: var(--text); font-size: 14px; line-height: 1.43; letter-spacing: -.224px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue-focus); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }

.f-haiku { --c: var(--haiku); --cl: var(--haiku-l); --ci: var(--haiku-i); }
.f-sonnet { --c: var(--sonnet); --cl: var(--sonnet-l); --ci: var(--sonnet-i); }
.f-opus { --c: var(--opus); --cl: var(--opus-l); --ci: var(--opus-i); }
.f-fable, .f-mythos { --c: var(--fable); --cl: var(--fable-l); --ci: var(--fable-i); }
.f-none { --c: var(--none); --cl: var(--none-l); --ci: var(--none-i); }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; font-size: 12px; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* 液态玻璃材质：透明 + 背景模糊 + 顶边高光 + 发丝边 */
.lg { -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); }

.btn { border: 1px solid var(--blue); background: transparent; color: var(--blue); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 400; cursor: pointer; white-space: nowrap; transition: transform .12s; }
.btn.primary { background: var(--blue); color: #fff; }
.btn:active { transform: scale(.95); }

.app { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: 100vh; }

/* ---------- 侧栏：磨砂羊皮纸 ---------- */
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--hair); background: rgba(245, 245, 247, .8); -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); z-index: 5; }
.rail-in { height: 100%; padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 28px; overflow-y: auto; }
.brand { display: flex; align-items: center; justify-content: space-between; }
.brand b { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; }
.conn { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.conn.ok i { background: var(--green); }
.demo { font-size: 12px; color: var(--opus-i); }

.rail h3 { margin: 0 0 10px; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: -.12px; }
.spend .big { font-family: var(--display); font-size: 40px; font-weight: 600; letter-spacing: -.374px; line-height: 1.1; }
.spend .vs { margin-top: 6px; color: var(--ink80); font-size: 14px; }
.spend .vs b { color: var(--green-i); font-weight: 600; }
.mix { display: flex; height: 4px; margin: 18px 0 12px; gap: 2px; border-radius: 999px; overflow: hidden; }
.mix span { background: var(--c); min-width: 3px; }
.mixrow { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; font-size: 12px; padding: 4px 0; color: var(--muted); }
.mixrow .n { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.mixrow .n::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.spend .foot { margin-top: 10px; font-size: 11px; color: var(--faint); letter-spacing: -.08px; }

.projects { display: flex; flex-direction: column; gap: 2px; }
.proj { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-radius: var(--r-md); background: none; cursor: pointer; }
.proj:hover { background: rgba(0, 0, 0, .035); }
.proj.sel { background: var(--canvas); box-shadow: 0 0 0 1px var(--hair2); }
.proj .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .when { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.proj .sub { grid-column: 2; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.proj .sub .chip { font-weight: 400; color: var(--ink80); }
.proj.need .name { color: var(--red-i); }
.st { width: 18px; height: 20px; display: grid; place-items: center; }
.st i { width: 8px; height: 8px; border-radius: 50%; }
.st.running i, .st.bg i { background: var(--green); }
.st.idle i { box-shadow: inset 0 0 0 1.5px var(--faint); }
.st.ended i { background: var(--hair); }
.st.need i { width: 16px; height: 16px; background: var(--red); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; }
@media (prefers-reduced-motion: no-preference) { .st.running i, .st.bg i { animation: blink 1.6s ease-in-out infinite; } }
@keyframes blink { 50% { opacity: .3; } }

.remote { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink80); }
.url { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--canvas); border: 1px solid var(--hair); padding: 6px 12px; border-radius: 999px; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.remote a { color: var(--blue); text-decoration: none; }
.notify { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
/* 语言切换：浅色侧栏上的胶囊分段控件 / language toggle: pill segmented control for the light rail */
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; color: var(--muted); }
.langseg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(0, 0, 0, .05); border: 1px solid var(--hair2); }
.langseg button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.langseg button:hover { color: var(--ink); }
.langseg button.on { background: var(--canvas); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 .5px var(--hair); }

/* ---------- 主区 ---------- */
main { min-width: 0; padding-bottom: 64px; }
.subnav { position: sticky; top: 0; z-index: 4; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 32px; background: rgba(245, 245, 247, .72); -webkit-backdrop-filter: var(--frost); backdrop-filter: var(--frost); border-bottom: 1px solid var(--hair); }
.subnav .p { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subnav .since { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.running, .pill.bg { background: rgba(52, 199, 89, .14); color: var(--green-i); }
.pill.need { background: rgba(255, 59, 48, .12); color: var(--red-i); }
.pill.idle { background: rgba(0, 0, 0, .05); color: var(--ink80); }
.pill.ended { background: rgba(0, 0, 0, .04); color: var(--muted); }
.wrapc { max-width: 1240px; margin: 0 auto; padding: 0 32px; display: flex; flex-direction: column; gap: 24px; }
.alerts { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.alerts:empty { display: none; }
.alert { display: flex; align-items: center; gap: 12px; border-radius: var(--r-lg); padding: 12px 12px 12px 16px; background: var(--canvas); border: 1px solid rgba(255, 59, 48, .28); }
.alert .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.alert .tx { flex: 1; min-width: 0; font-size: 14px; }
.alert .tx b { font-weight: 600; }

.head { padding: 40px 0 8px; }
.head h1 { margin: 0 0 16px; font-family: var(--display); font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -.374px; max-width: 24em; text-wrap: balance; }
.head h1.quiet { color: var(--faint); }
.head h1[title] { cursor: help; }
.fullbtn { border: 0; background: rgba(0, 0, 0, .05); color: var(--ink80); font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.fullbtn:hover { background: rgba(0, 0, 0, .08); }
.fulltext { margin: 14px 0 0; max-width: 60em; font-size: 14px; line-height: 1.55; color: var(--ink80); white-space: pre-wrap; word-break: break-word; background: var(--canvas); border: 1px solid var(--hair); border-radius: var(--r-md); padding: 12px 14px; max-height: 220px; overflow-y: auto; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; color: var(--ink80); font-size: 14px; }
.reason { color: var(--ink80); }
.reason em { font-style: normal; color: var(--muted); }

.panel { background: var(--canvas); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 24px; min-width: 0; }
.panel > h2 { margin: 0 0 18px; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; }
.panel > h2 > :first-child { white-space: nowrap; }
.panel > h2 small { font-family: var(--text); font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: -.12px; }

.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; color: var(--ink80); }
.kv b { color: var(--ink); font-weight: 600; }
.meter { display: inline-flex; gap: 3px; align-items: center; }
.meter i { width: 10px; height: 4px; border-radius: 999px; background: var(--hair); }
.meter i.on { background: var(--c); }
.meter span { margin-left: 6px; color: var(--ink80); font-size: 12px; }

/* ---------- 深色分工区块：整页唯一的深色块，液态玻璃卡片浮在模型色的光晕上 ---------- */
.panel.dark { background: var(--tile); border-color: var(--tile); color: #f5f5f7; padding: 28px; border-radius: var(--r-xl); overflow: hidden; position: relative; }
.panel.dark > h2 { color: #f5f5f7; position: relative; z-index: 1; }
.panel.dark > h2 small { color: rgba(235, 235, 245, .6); }
.panel.dark .meter i { background: rgba(255, 255, 255, .16); }
.panel.dark .meter i.on { background: var(--cl); }
.panel.dark .meter span { color: rgba(235, 235, 245, .8); }
.glow { position: absolute; inset: 0; pointer-events: none; opacity: .9; }
.glass { position: relative; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(255, 255, 255, .04), inset 1px 0 0 rgba(255, 255, 255, .06); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(140deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 38%); }

.flowwrap { position: relative; z-index: 1; }
.fsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.fsvg path { fill: none; stroke-width: 1.5; stroke-linecap: round; }
.fsvg .e-done { stroke: rgba(255, 255, 255, .22); }
.fsvg .e-run { stroke: var(--c); stroke-dasharray: 4 6; filter: drop-shadow(0 0 4px var(--c)); }
.fsvg .e-fail { stroke: var(--red); stroke-dasharray: 2 4; }
.fsvg .e-adv { stroke: var(--fable-l); stroke-dasharray: 2 4; opacity: .6; }
.fsvg circle.dot0 { fill: var(--tile); stroke: rgba(255, 255, 255, .5); stroke-width: 1.25; }
.fsvg circle.dot1 { stroke: var(--tile); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) { .fsvg .e-run { animation: flow .9s linear infinite; } }
@keyframes flow { to { stroke-dashoffset: -10; } }

.flowgrid { display: grid; grid-template-columns: minmax(300px, 380px) 110px minmax(0, 500px); align-items: center; position: relative; z-index: 1; }
.flowgrid.solo { grid-template-columns: minmax(300px, 380px) 1fr; }
.leftcol { display: flex; flex-direction: column; gap: 14px; }
.glyph { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 18px;
  background: linear-gradient(180deg, var(--cl), var(--c)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.glyph.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; }

.mn { border-radius: 24px; padding: 20px 20px 16px; }
.mn .hd { display: flex; align-items: center; gap: 12px; }
.mn .ttl { min-width: 0; }
.mn .ttl b { display: block; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .231px; color: #fff; line-height: 1.19; }
.mn .ttl span { font-size: 12px; color: rgba(235, 235, 245, .6); }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.state.running, .state.bg { background: rgba(52, 199, 89, .18); color: #63E28A; }
.state.need { background: rgba(255, 69, 58, .2); color: #FF8A80; }
.state.idle, .state.ended { background: rgba(255, 255, 255, .1); color: rgba(235, 235, 245, .8); }
.state i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: no-preference) { .state.running i, .state.bg i { animation: blink 1.4s ease-in-out infinite; } }
.gauges { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin: 18px 0 14px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .06); }
.gauges .g-l { display: flex; flex-direction: column; gap: 9px; font-size: 12px; color: rgba(235, 235, 245, .6); }
.gauges .g-l > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gauges .g-l b { color: #fff; font-weight: 600; }
.ring { position: relative; width: 54px; height: 54px; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .rbg { stroke: rgba(255, 255, 255, .12); }
.ring .rfg { stroke: var(--cl); stroke-linecap: round; }
.ring.warn .rfg { stroke: var(--opus-l); } .ring.bad .rfg { stroke: #FF6961; }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; }
.now { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(235, 235, 245, .7); min-height: 22px; }
.now .mono { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.now .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
.now .pulse.off { background: rgba(255, 255, 255, .2); }
.now .pulse.need { background: var(--red); }
@media (prefers-reduced-motion: no-preference) { .now .pulse:not(.off) { animation: blink 1.1s ease-in-out infinite; } }
.stats { display: flex; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .08); font-size: 12px; color: rgba(235, 235, 245, .6); }
.stats b { color: #fff; font-weight: 600; }
.test { margin-top: 8px; font-size: 12px; font-weight: 600; }
.test.good { color: #63E28A; } .test.bad { color: #FF8A80; }
.adv { border-radius: var(--r-lg); background: rgba(166, 75, 214, .12); border: 1px solid rgba(218, 143, 255, .22); padding: 12px 14px; font-size: 12px; color: rgba(235, 235, 245, .78); margin-left: 28px; }
.adv b { color: var(--fable-l); font-weight: 600; }

.agcol { display: flex; flex-direction: column; gap: 10px; }
.agcol-h { font-size: 12px; color: rgba(235, 235, 245, .6); margin: 0 0 2px 4px; }
.agcol-h b { color: #fff; font-weight: 600; }
.ag { border-radius: var(--r-lg); padding: 12px 14px 12px 12px; }
.ag .r1 { display: flex; align-items: center; gap: 10px; }
.ag .who { min-width: 0; flex: 1; }
.ag .ty { display: block; font-weight: 600; font-size: 14px; color: #fff; line-height: 1.29; }
.ag .mdl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(235, 235, 245, .6); }
.ag .mdl b { color: var(--cl); font-weight: 600; }
.ag .side { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(235, 235, 245, .6); }
.ag .ds { font-size: 13px; color: rgba(255, 255, 255, .92); margin: 9px 0 0 38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .r3 { margin: 4px 0 0 38px; font-size: 12px; color: rgba(235, 235, 245, .55); display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.ag .r3 .mono { color: rgba(235, 235, 245, .85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .r3.ret { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ag.running { border-color: color-mix(in srgb, var(--cl) 55%, transparent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 0 0 1px color-mix(in srgb, var(--cl) 25%, transparent), 0 0 28px -6px color-mix(in srgb, var(--c) 70%, transparent); }
.ag.failed { border-color: rgba(255, 69, 58, .5); }
.si { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 10px; font-weight: 600; color: #fff; }
.si.done { background: var(--green); }
.si.failed { background: var(--red); }
.si.stopped { background: var(--none); }
.si.running { border: 2px solid rgba(255, 255, 255, .15); border-top-color: var(--cl); }
@media (prefers-reduced-motion: no-preference) { .si.running { animation: spin .8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.more { font-size: 12px; color: rgba(235, 235, 245, .55); padding: 2px 4px; }
.solo-note { margin-left: 32px; padding: 16px 18px; border-radius: var(--r-lg); color: rgba(235, 235, 245, .6); font-size: 13px; max-width: 420px; }

/* ---------- 分工图的交互与动效 ---------- */
.fsvg .eg path { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke: rgba(255, 255, 255, .2); transition: stroke-width .25s, stroke .25s; }
.fsvg .eg.running path { stroke: color-mix(in srgb, var(--c) 80%, transparent); stroke-dasharray: 5 7; }
@media (prefers-reduced-motion: no-preference) { .fsvg .eg.running path { animation: dashflow .8s linear infinite; } }
@keyframes dashflow { to { stroke-dashoffset: -12; } }
/* 已完成的卡片收成一行 / finished cards collapse to one line */
.ag.compact { padding: 8px 12px 8px 10px; }
.ag.compact .ds, .ag.compact .r3 { display: none; }
.ag.compact .ty { font-size: 13px; }
.ag.compact .mdl > :not(b) { display: none; }
.ag.bgtask .glyph { background: linear-gradient(180deg, #8E8E93, #636366); font-size: 14px; }

let LANG = 'en';
// t('key', ...args)：参数可以是函数，按当前语言求值 / args may be functions of the language
function t(key, ...args) {

  if (v == null) return key;
  return typeof v === 'function' ? v(...args.map(a => typeof a === 'function' ? a(LANG) : a)) : v;
}
const has = key => I18N[LANG][key] != null || I18N.en[key] != null;
function storedLang() { try { const v = localStorage.getItem('viz.lang'); return v === 'en' || v === 'zh' ? v : null; } catch (e) { return null; } }
function resolveLang() {
  return storedLang() || (state && (state.lang === 'en' || state.lang === 'zh') ? state.lang : null)
    || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');
}

const agentType = ty => ty === 'subagent' ? t('subagent') : ty;
const toolText = l => l === 'tool' ? t('tool') : typeof l === 'string' && l.endsWith('→ subagent') ? l.slice(0, -8) + t('subagent') : l;
const projName = x => (x && x.project) || t('unknownProject');
const turnPrompt = tu => tu.handback ? (tu.prompt || t('handbackTurn')) : tu.prompt;
const byLabel = k => !k ? '' : has('by_' + k) ? t('by_' + k) : k;
const statusLabel = k => has('st_' + k) ? t('st_' + k) : k;
function logText(x) {
  if (!Array.isArray(x)) return String(x == null ? '' : x);
  const [k, ...a] = x;
  switch (k) {
    case 'spawned': return t('log_spawned', a[0] === 'subagent' ? t('aSubagent') : a[0], a[1] || '');
    case 'toolFailed': return t('log_toolFailed', toolText(a[0]));
    case 'agentEnded': return t('log_agentEnded', a[0], dur(a[1] || 0));
    case 'route': return t('log_route', a[0] || '?', a[1] || '', byLabel(a[2]), a[3] || '');
    case 'advisor': return t('log_advisor', a[0] || '', a[1] || '');
  }

}

const cache = {};

// ---------- 切换语言：清掉所有缓存，立刻重画（不用重连） / switch language: drop every memo and redraw, no reconnect ----------
function applyStatic() {

}
function applyLang(l) {
  LANG = l;

  for (const k of Object.keys(cache)) delete cache[k];

// ---------- 静态演示（GitHub Pages）：回放录好的快照 / static demo: replay recorded snapshots ----------
const STATIC = window.VIZ_STATIC || null;
const REPO = 'https://github.com/paxon-yang/claude-agent-tools';
let replay = null;
function startReplay(lang) {
  if (replay) clearTimeout(replay.timer);
  const r = replay = { lang, timer: null };
  conn = 'replay'; renderConn();
  fetch(STATIC + 'snapshots.' + lang + '.json').then(x => x.json()).then(data => {
    const frames = data.frames || [];
    if (replay !== r || !frames.length) return;
    let i = 0;
    const step = () => {
      if (replay !== r) return;
      const fr = frames[i];
      state = fr.s; skew = state.now - Date.now() / 1000;
      if (resolveLang() !== LANG) applyLang(resolveLang()); else render();
      i++;
      if (i < frames.length) { r.timer = setTimeout(step, Math.max(0, frames[i].t - fr.t) * 1000); return; }
      r.timer = setTimeout(() => { i = 0; step(); }, 7000);
    };
    step();
  }).catch(() => { conn = 'reconnecting'; renderConn(); });
}

function connect() {
  if (STATIC) { selected = null; pinned = false; const l = storedLang() || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en'); applyLang(l); startReplay(l); return; }
  const es = new EventSource('/api/stream');
  es.onopen = () => { conn = 'live'; renderConn(); };
  es.onmessage = ev => {
    state = JSON.parse(ev.data); skew = state.now - Date.now() / 1000;
    const l = resolveLang();
    if (l !== LANG) applyLang(l); else render();
  };
  es.onerror = () => { conn = 'reconnecting'; renderConn(); };
}

function pick() {
  const ss = state.sessions;
  if (!ss.length) return null;
  const sel = ss.find(s => s.id === selected);
  if (pinned && sel) return sel;
  // 静态演示先展示有分工的那个会话 / the static demo opens on the session that delegates
  const showcase = STATIC && !pinned && ss.find(s => s.id === 'demo-session-1');
  if (showcase) { selected = showcase.id; return showcase; }
  const auto = ss.find(s => s.active && s.status === 'needs-you') || ss.find(s => s.active && s.status === 'running') || ss.find(s => s.active) || ss[0];
  selected = auto.id; return auto;
}
function select(id) { selected = id; pinned = true; try { localStorage.setItem('viz.sel', id); } catch (e) { } render(); }

function renderSpend() {

// 把你发的一大段话压成一句标题：去掉"帮我/请"这类开头，取第一个够长的分句，中文约 20 字、英文约 56 个字符
// Turn a long prompt into a short title: drop polite openers, keep the first meaningful clause, cap the length
function brief(p) {
  const full = String(p == null ? '' : p).replace(/```[\s\S]*?```/g, ' ').replace(/`([^`]*)`/g, '$1')
    .replace(/https?:\/\/\S+/g, ' ').replace(/[#>*_]+/g, ' ').replace(/\s+/g, ' ').trim();
  let s = full.replace(/^(?:(?:请你|请帮我|你帮我|帮我|帮忙|麻烦你?|你能不能|能不能|可以帮我|我想让你|我需要你|我想|请|好的|那)[，,\s]*)+/, '')
    .replace(/^(?:(?:please|can you|could you|would you|help me|i want you to|i need you to|i'd like you to|ok(?:ay)?|so)[,\s]+)+/i, '');
  if (!s) s = full;
  const cjk = /[\u3400-\u9fff]/.test(s);
  // 按显示宽度算：汉字 1，英文字母约 0.55 / measure by visual width: CJK 1, Latin ~0.55
  const W = str => { let w = 0; for (const ch of str) w += /[\u2e80-\uffef]/.test(ch) ? 1 : 0.55; return w; };
  const max = cjk ? 20 : 31, min = cjk ? 6 : 10, slack = cjk ? 6 : 8;
  const trimEnd = x => x.replace(/[。！？!?；;：:，,、\s]+$/, '');
  let out = '';
  for (const c of s.split(/(?<=[。！？!?；;：:，,\n])\s*/)) { out += c; if (W(trimEnd(out)) >= min) break; }
  out = trimEnd(out);
  let cut = out.length < trimEnd(s).length;
  if (W(out) > max + slack) {                        // 稍微超一点就整句保留 / keep a clause that is only a little over
    let head = '', w = 0;
    for (const ch of out) { const cw = /[\u2e80-\uffef]/.test(ch) ? 1 : 0.55; if (w + cw > max) break; head += ch; w += cw; }
    const rest = out.slice(head.length);
    if (/[A-Za-z0-9]$/.test(head) && /^[A-Za-z0-9]/.test(rest)) head = head.replace(/[A-Za-z0-9._-]+$/, '');   // 不把英文单词切一半 / don't split a word
    if (!cjk && /\s/.test(head)) head = head.replace(/\s+\S*$/, '');
    out = trimEnd(head) || out.slice(0, 12);
    cut = true;
  }
  if (!cjk) out = out.charAt(0).toUpperCase() + out.slice(1);
  return out + (cut ? '…' : '');
}

  cards.forEach(el => {
    const id = el.dataset.aid, st = el.dataset.st, safe = id.replace(/[^\w-]/g, '_');

    const x1 = R.left - W.left, y1 = R.top + R.height / 2 - W.top;
    let d;
    if (!stacked) { const dx = (x1 - x0) * 0.55; d = `M${x0},${y0} C${x0 + dx},${y0} ${x1 - dx},${y1} ${x1},${y1}`; }
    else d = `M${x0},${y0} L${x0},${y1 - 10} Q${x0},${y1} ${x0 + 10},${y1} L${x1},${y1}`;
    let grp = g.querySelector(`[data-e="${CSS.escape(id)}"]`), fresh = false;
    if (!grp) {
      grp = document.createElementNS(NS, 'g'); grp.dataset.e = id;
      grp.innerHTML = `<path class="edge" id="ep-${safe}"/><g class="parts"></g><circle class="dot1" r="4.5"/>`;
      g.appendChild(grp); fresh = true;
    }
    const fm = (el.className.match(/f-(\w+)/) || [])[1];
    grp.style.setProperty('--c', `var(--${famKey(fm)}-l)`);
    grp.setAttribute('class', `eg ${st}${el.classList.contains('hl') ? ' hl' : ''}${el.classList.contains('dim') ? ' dim' : ''}`);
    const path = grp.querySelector('path');
    if (path.getAttribute('d') !== d) path.setAttribute('d', d);
    const dot = grp.querySelector('.dot1');
    dot.setAttribute('cx', x1); dot.setAttribute('cy', y1);
    if (fresh && !RM && path.getTotalLength) {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      path.getBoundingClientRect();
      path.style.transition = 'stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)';
      path.style.strokeDashoffset = '0';
      setTimeout(() => { path.style.strokeDasharray = ''; path.style.strokeDashoffset = ''; path.style.transition = ''; }, 900);
    }
    const parts = grp.querySelector('.parts');
    const flowing = st === 'running' && !RM;
    if (flowing && !parts.querySelector('.pt')) {
      parts.innerHTML = [0, 1, 2].map(i => `<circle class="pt" r="2.4"><animateMotion dur="1.8s" begin="${(-i * 0.6).toFixed(1)}s" repeatCount="indefinite"><mpath href="#ep-${safe}" xlink:href="#ep-${safe}"/></animateMotion></circle>`).join('');
    } else if (!flowing && parts.querySelector('.pt')) parts.innerHTML = '';
    if (flowState.pulse.has(id) && !RM) {
      flowState.pulse.delete(id);
      parts.insertAdjacentHTML('beforeend', `<circle class="back" r="3.5"><animateMotion dur=".9s" begin="indefinite" fill="freeze" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#ep-${safe}" xlink:href="#ep-${safe}"/></animateMotion></circle>`);
      const c = parts.lastElementChild, am = c.querySelector('animateMotion');
      try { am.beginElement(); } catch (e) { }
      setTimeout(() => c.remove(), 1000);
    }
  });
  [...g.querySelectorAll(':scope > g[data-e]')].forEach(grp => { if (!seen.has(grp.dataset.e)) grp.remove(); });
  let d0 = g.querySelector('.dot0');
  if (cards.length) {
    if (!d0) { d0 = document.createElementNS(NS, 'circle'); d0.setAttribute('class', 'dot0'); d0.setAttribute('r', '5'); g.appendChild(d0); }
    d0.setAttribute('cx', x0); d0.setAttribute('cy', y0);
  } else if (d0) d0.remove();
  let ea = g.querySelector('.e-adv');
  const adv = document.getElementById('fadv');
  if (adv && !stacked) {
    const A = adv.getBoundingClientRect(), xa = M.left - W.left + 14, ya = A.top + A.height / 2 - W.top;
    if (!ea) { ea = document.createElementNS(NS, 'path'); ea.setAttribute('class', 'e-adv'); g.appendChild(ea); }
    ea.setAttribute('d', `M${xa},${M.bottom - W.top} L${xa},${ya - 8} Q${xa},${ya} ${xa + 8},${ya} L${A.left - W.left},${ya}`);
  } else if (ea) ea.remove();
}

// 悬停：高亮这张卡和它的连线，其余变淡
function applyHover() {
  const id = flowState.hover;
  document.querySelectorAll('#aglist .ag').forEach(el => { el.classList.toggle('hl', !!id && el.dataset.aid === id); el.classList.toggle('dim', !!id && el.dataset.aid !== id); });
  document.querySelectorAll('#edges > g[data-e]').forEach(grp => { grp.classList.toggle('hl', !!id && grp.dataset.e === id); grp.classList.toggle('dim', !!id && grp.dataset.e !== id); });
}
document.addEventListener('mouseover', e => {
  const card = e.target.closest && e.target.closest('#aglist .ag');
  const id = card ? card.dataset.aid : null;
  if (id !== flowState.hover) { flowState.hover = id; applyHover(); }
});
// 液态玻璃：高光跟着鼠标走
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('.panel.dark .glass');
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
document.addEventListener('click', e => {
  const tg = e.target;
  const lb = tg.closest && tg.closest('#langseg button');
  if (lb) { setLang(lb.dataset.lang); return; }
  const fb = tg.closest && tg.closest('#filters button');
  if (fb) { flowState.filter = fb.dataset.filter; flowState.showAll = false; const s = pick(); if (s) renderFlow(s); return; }
  if (tg.closest && tg.closest('#foldbtn')) { flowState.expandDone = !flowState.expandDone; try { localStorage.setItem('viz.expandDone', flowState.expandDone ? '1' : '0'); } catch (e) { } const s = pick(); if (s) renderFlow(s); return; }
  if (tg.closest && tg.closest('#agmore')) { flowState.showAll = !flowState.showAll; const s = pick(); if (s) renderFlow(s); return; }
  const card = tg.closest && tg.closest('#aglist .ag');
  if (card) { openSheet({ kind: 'agent', id: card.dataset.aid }); return; }
  if (tg.closest && tg.closest('#fmain')) { openSheet({ kind: 'main' }); return; }
  if (tg.closest && (tg.closest('#scrim') || tg.closest('#sheetx'))) closeSheet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && flowState.open) { closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && (document.activeElement.matches('#aglist .ag') || document.activeElement.id === 'fmain')) {
    e.preventDefault(); document.activeElement.click();
  }
});
window.addEventListener('resize', () => requestAnimationFrame(drawEdges));

// ---------- 详情面板（液态玻璃抽屉） ----------
function openSheet(o) {
  flowState.open = o; flowState.lastFocus = document.activeElement;
  document.body.classList.add('sheet-open');
  document.getElementById('sheet').setAttribute('aria-hidden', 'false');
  const s = pick(); if (s) { renderFlow(s); renderSheet(s); }
  setTimeout(() => { const x = document.getElementById('sheetx'); if (x) x.focus(); }, 50);
}
function closeSheet() {
  flowState.open = null;
  document.body.classList.remove('sheet-open');
  const sh = document.getElementById('sheet'); if (sh) sh.setAttribute('aria-hidden', 'true');
  document.querySelectorAll('#aglist .ag.sel, #fmain.sel').forEach(el => el.classList.remove('sel'));
  if (flowState.lastFocus && flowState.lastFocus.focus) flowState.lastFocus.focus();
}
function stepsHTML(steps) {
  if (!steps || !steps.length) return `<div class="sh-empty">${t('noSteps')}</div>`;
  return `<ol class="steps">${steps.slice().reverse().map(p => `<li class="${p.end ? (p.ok ? 'ok' : 'bad') : 'run'}"><span class="t num">${hm(p.ts)}</span><span class="l mono">${esc(toolText(p.label))}</span><span class="r num">${p.end ? (p.ok ? dur(p.end - p.ts) : t('failed')) : t('inProgress')}</span></li>`).join('')}</ol>`;
}
function renderSheet(s) {
  const o = flowState.open; if (!o) return;
  const body = document.getElementById('sheetbody');
  if (o.kind === 'main') {
    const pct = s.contextLimit ? s.context / s.contextLimit : 0;
    const ds = (s.decisions || []).slice().reverse();
    setHTML(body, `<div class="sh-h"><span class="glyph ${f(s.family)}">${esc((NAMES[s.family] || s.model || '?')[0])}</span><div><b>${esc(s.model || t('mainSession'))}</b><span>${t('mainOf', esc(projName(s)))}</span></div></div>
      <div class="sh-facts"><div><span>effort</span><b>${esc(s.effort || '—')}</b></div><div><span>${t('context')}</span><b class="num">${t('ctxPct', kfmt(s.context), Math.round(pct * 100))}</b></div><div><span>${t('toolCalls')}</span><b class="num">${t('times', s.toolCount)}</b></div><div><span>${t('subagents')}</span><b class="num">${t('count', s.totalAgents)}</b></div></div>
      <h4>${t('whyModel')}</h4>${ds.length ? `<ol class="dec">${ds.map(d0 => `<li><span class="t num">${hm(d0.at)}</span><span>${chip(d0.fam, d0.model)}</span><span class="why">${esc(t('byReason', byLabel(d0.by), d0.reason || ''))}</span></li>`).join('')}</ol>` : `<div class="sh-empty">${t('noDecisions')}</div>`}
      <h4>${t('recentSteps')}</h4>${stepsHTML(s.steps)}`);
    return;
  }
  const x = flowItems(s).find(y => y.id === o.id);
  if (!x) { setHTML(body, `<div class="sh-empty" style="padding-top:40px">${t('agentGone')}</div>`); return; }
  if (x.kind === 'bg') {
    setHTML(body, `<div class="sh-h"><span class="glyph" style="background:linear-gradient(180deg,#8E8E93,#636366)">◷</span><div><b>${esc(bgName(x.type))}</b><span>${esc(t('bgSub'))}</span></div><span class="pill ${x.status === 'running' ? 'running' : x.status === 'done' ? 'idle' : 'need'}">${esc(statusLabel(x.status))}</span></div>
      <div class="sh-facts"><div><span>${t('duration')}</span><b class="num">${timer(x.startedAt, x.endedAt)}</b></div><div><span>${t('started')}</span><b class="num">${hm(x.startedAt)}</b></div></div>
      <h4>${t('assigned')}</h4><div class="sh-text">${esc(x.description || x.label || t('noDesc'))}</div>
      ${x.label ? `<h4>${t('steps')}</h4><div class="sh-text mono">${esc(x.label)}</div>` : ''}
      ${x.lastMessage ? `<h4>${t('returnedTitle')}</h4><div class="sh-text">${esc(x.lastMessage)}</div>` : ''}`);
    return;
  }
  const src = x.modelSource ? (has('src_' + x.modelSource) ? t('src_' + x.modelSource) : x.modelSource) : '';
  setHTML(body, `<div class="sh-h"><span class="glyph ${f(x.family)}">${esc((NAMES[x.family] || x.model || '?')[0])}</span><div><b>${esc(agentType(x.type))}</b><span>${esc(x.model || t('unknownModel'))} · ${esc(src)}</span></div><span class="pill ${x.status === 'running' ? 'running' : x.status === 'done' ? 'idle' : 'need'}">${esc(statusLabel(x.status))}</span></div>
    <div class="sh-facts"><div><span>${t('duration')}</span><b class="num">${timer(x.startedAt, x.endedAt)}</b></div><div><span>effort</span><b>${esc(x.effort || '—')}</b></div><div><span>${t('toolCalls')}</span><b class="num">${t('times', x.toolCount)}</b></div><div><span>${t('started')}</span><b class="num">${hm(x.startedAt)}</b></div></div>
    <h4>${t('assigned')}</h4><div class="sh-text">${esc(x.description || t('noDesc'))}</div>
    ${x.lastMessage ? `<h4>${t('returnedTitle')}</h4><div class="sh-text">${esc(x.lastMessage)}</div>` : ''}
    <h4>${t('steps')}</h4>${stepsHTML(x.steps)}`);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawEdges));

// ---------- 模型时间轴 ----------
function renderTimeline(s) {
  const turns = (s.turns || []).slice(-12);
  const lanes = (s.lanes || []).filter(l => !turns.length || l.start >= turns[0].start - 5).slice(-8);
  if (!turns.length && !lanes.length) { put('tl', `<div class="tl-empty">${t('tlEmpty')}</div>`); return; }
  const t1 = s.active ? nowS() : Math.max(s.lastTs, ...turns.map(tu => tu.end || 0), ...lanes.map(l => l.end || 0));
  const first = Math.min(...turns.map(tu => tu.start), ...lanes.map(l => l.start));
  const raw = Math.max(60, t1 - first);
  const t0 = first - raw * 0.02;                 // 左边留一点空
  const span = Math.max(60, t1 - t0);
  const x = ts => Math.max(0, Math.min(100, (ts - t0) / span * 100));
  const steps = [10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400];
  const maxTicks = window.innerWidth < 600 ? 3 : 6;
  const step = steps.find(v => span / v <= maxTicks) || 28800;
  const ticks = []; for (let v = Math.ceil(t0 / step) * step; v <= t1; v += step) ticks.push(v);
  const grid = ticks.map(v => `<span class="tl-grid" style="left:${x(v)}%"></span>`).join('');
  const now = s.active ? `<span class="tl-now" style="left:${x(t1)}%" title="${t('now')}"></span>` : '';
  const segs = turns.map(tu => tu.segs.map((g, i) => {
    const a = Math.max(g.start, tu.start), b = i < tu.segs.length - 1 ? tu.segs[i + 1].start : (tu.end || t1);
    const w = x(b) - x(a);
    const tip = `<b>${esc(NAMES[g.family] || g.model || t('unknown'))}</b>${g.effort ? ' · ' + esc(g.effort) : ''}<br>${esc(tu.handback ? turnPrompt(tu) : brief(tu.prompt))}<br><span class='d'>${esc(t('tipStart', hm(a), tu.end ? dur(b - a) : t('inProgress')))}${g.reason ? '<br>' + esc(t('byReason', byLabel(g.by), g.reason)) : ''}</span>`;
    return `<span class="seg main ${f(g.family)} ${tu.end ? '' : 'open'} ${tu.handback ? 'hb' : ''}" style="left:${x(a)}%;width:${w}%" data-tip="${esc(tip)}">${w > 7 ? esc(NAMES[g.family] || '') : ''}</span>`;
  }).join('')).join('');
  const rows = lanes.map(l => {
    const b = l.end || t1, w = x(b) - x(l.start);
    const nm = l.kind === 'bg' ? bgName(l.type) : agentType(l.type);
    const tip = `<b>${esc(nm)}</b>${l.model ? ' · ' + esc(l.model) : ''}<br>${esc(l.description || '')}<br><span class='d'>${esc(t('tipStart', hm(l.start), l.end ? dur(b - l.start) : t('inProgress')))}</span>`;
    return `<div class="tl-row"><div class="tl-label" title="${esc(nm)}">${esc(nm)}</div><div class="tl-track">${grid}<span class="seg ${f(l.family)} ${l.end ? '' : 'open'}" style="left:${x(l.start)}%;width:${w}%" data-tip="${esc(tip)}">${w > 9 ? esc(l.model || '') : ''}</span></div></div>`;
  }).join('');
  const used = [...new Set([...turns.flatMap(tu => tu.segs.map(g => g.family)), ...lanes.map(l => l.family)].filter(Boolean))];
  put('tl', `<div class="tl"><div class="tl-axis">${ticks.map(v => `<span style="left:${x(v)}%">${step < 60 ? hm(v) + ':' + String(Math.round(v) % 60).padStart(2, '0') : hm(v)}</span>`).join('')}</div>
    <div class="tl-row"><div class="tl-label"><b>${t('mainShort')}</b></div><div class="tl-track">${grid}${segs}${now}</div></div>${rows}</div>
    <div class="tl-legend">${ORDER.filter(k => used.includes(k)).map(k => `<span class="${f(k)}">${NAMES[k]}</span>`).join('')}<span style="--c:repeating-linear-gradient(135deg,#98A2B3 0 4px,#D0D5DD 4px 8px)">${t('striped')}</span></div>`);
}
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.classList.remove('on'); return; }
  tip.innerHTML = el.dataset.tip; tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 16 + h > window.innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
});

// ---------- 花费 ----------
function renderUse(s) {
  const u = s.usage || { byModel: {} };
  const fams = ORDER.filter(k => u.byModel[k]);
  if (!fams.length) { put('use', `<div class="tl-empty">${t('useEmpty')}</div>`); return; }
  const base = esc(NAMES[state.totals.baselineModel] || 'Opus');
  const rows = fams.map(k => { const b = u.byModel[k]; return `<tr><td>${chip(k)}</td><td class="r num">${kfmt(b.in + b.cw)}</td><td class="r num">${kfmt(b.cr)}</td><td class="r num">${kfmt(b.out)}</td><td class="r num"><b>${money(b.cost)}</b></td></tr>`; }).join('');
  put('use', `<table class="use"><thead><tr><th>${t('th_model')}</th><th class="r">${t('th_in')}</th><th class="r">${t('th_cr')}</th><th class="r">${t('th_out')}</th><th class="r">${t('th_cost')}</th></tr></thead><tbody>${rows}
    <tr><td><b>${t('total')}</b></td><td></td><td></td><td></td><td class="r num"><b>${money(u.cost)}</b></td></tr></tbody></table>
    ${u.saved != null && u.baseline > 0 ? (u.saved >= 0.01 ? `<div class="save">${t('saveLine', base, money(u.baseline), Math.round(u.saved * 100))}</div>`
      : `<div class="fine">${t('sameCost', base)}</div>`) : ''}
    <div class="fine">${t('useFine')}</div>`);
}

function renderHist(s) {
  const turns = (s.turns || []).slice().reverse();
  put('histsub', turns.length ? t('histSub', turns.filter(tu => !tu.handback).length) : '');
  if (!turns.length) { put('hist', `<div class="tl-empty">${t('histEmpty')}</div>`); return; }
  put('hist', `<ul class="hist">${turns.slice(0, 12).map(tu => {
    const fams = [...new Set(tu.segs.map(g => g.family).filter(Boolean))];
    const p = turnPrompt(tu);
    return `<li class="${tu.end ? '' : 'cur'}"><span class="t num">${hm(tu.start)}</span><span class="p ${tu.handback ? 'hb' : ''}" title="${esc(p)}">${esc(tu.handback ? p : brief(p))}</span><span class="d num">${tu.end ? dur(tu.end - tu.start) : t('inProgress')}</span>
      <span class="m">${fams.map(k => chip(k)).join('')}</span></li>`;
  }).join('')}</ul>`);
}

function renderLog(s) {
  const famOf = w => w === 'main' ? s.family : w === 'advisor' ? 'fable' : w === 'router' ? 'haiku' : w === 'you' ? 'none' : ((s.lanes || []).find(l => l.type === w) || {}).family;
  const label = w => has('who_' + w) ? t('who_' + w) : agentType(w);
  put('log', s.timeline.slice().reverse().map(r => `<div class="lrow k-${esc(r.kind)}"><span class="t num">${hm(r.ts)}</span><span class="w ${f(famOf(r.who))}">${esc(label(r.who))}</span><span class="x">${esc(logText(r.text))}</span></div>`).join(''));
}

setInterval(() => { const n = nowS(); document.querySelectorAll('[data-since]').forEach(el => { el.textContent = dur(n - Number(el.dataset.since)); }); }, 1000);
setInterval(() => { if (state) { delete cache.tl; renderTimeline(pick() || {}); } }, 5000);
applyLang(resolveLang());
connect();
</script>
</body>
